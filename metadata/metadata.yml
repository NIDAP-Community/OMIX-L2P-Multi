metadata_version: 1
name: OMIX - L2P Multi
description: List to pathways (L2P) over-representation analysis for comparing multiple
  differential expression contrasts. Uses Fisher's exact test to identify enriched
  pathways and creates bubble plots comparing pathway enrichment across groups. Supports
  multiple pathway collections (GO, REACTOME, KEGG, MSigDB) and species via ortholog
  mapping. Includes demo dataset (Mouse RNA-seq with 3 comparisons) for easy testing
  - runs automatically if no input file is provided. Part of the OMIX analysis suite.
